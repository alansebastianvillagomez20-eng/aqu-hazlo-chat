name: Deploy Unknow OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Inject account risk engine
        run: sed -i 's#</body>#<script src="./risk-engine.js"></script></body>#' unknown-os/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: unknow-os
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
